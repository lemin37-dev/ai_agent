services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: agent-postgres
    environment:
      POSTGRES_DB:  agentlab
      POSTGRES_USER:  agent
      POSTGRES_PASSWORD:  agent
    ports:
      - "5432:5432"
    volumes:
      - agent_pgdate:/var/lib/postgresql/data
    # 헬시체크
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentlab"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
  agent:
    build: .
    container_name: agent-service
    env_file:
      - .env
    # environment:
    #   DATABASE_URL: postgresql://agent:agent@localhost:5432/agentlab
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  agent_pgdate: